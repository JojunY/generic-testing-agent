# OpenCode mapping (plan §11.4): translates the neutral fields of core/agents/*.md into OpenCode files.
# Generated output: opencode/ (committed; regenerate with scripts/generate.sh).
platform: opencode
agent:
  dir: .opencode/agents
  file: "{name}.md"
  emitName: false                    # OpenCode names agents after the file
  invocableField: null
  notInvocableFields: { hidden: true }
  subagentsField: null               # expressed through permission.task instead
models:
  # provider/model-id, picked by the P0a evals. null = OpenCode's configured default model.
  reasoning: null
  standard: null
profiles:
  orchestrator:
    mode: primary
    permission:
      edit: deny
      bash: &gtaw-bash   # same as Copilot: these subcommands run, every other gtaw command asks a person
        "*": deny
        "./gtaw *": ask
        ".\\gtaw.cmd *": ask
        ".\\gtaw *": ask
        "./gtaw next*": allow
        "./gtaw check*": allow
        "./gtaw submit*": allow
        "./gtaw answer*": allow
        "./gtaw status*": allow
        ".\\gtaw.cmd next*": allow
        ".\\gtaw.cmd check*": allow
        ".\\gtaw.cmd submit*": allow
        ".\\gtaw.cmd answer*": allow
        ".\\gtaw.cmd status*": allow
        ".\\gtaw next*": allow
        ".\\gtaw check*": allow
        ".\\gtaw submit*": allow
        ".\\gtaw answer*": allow
        ".\\gtaw status*": allow
      task: { "*": deny, "gta-*": allow }
  spec-writer:
    mode: subagent
    permission:
      edit: { "*": deny, ".gta/specs/**": allow }
      bash: *gtaw-bash
      task: deny
  test-writer:
    mode: subagent
    steps: 40
    permission:
      edit: allow
      bash: *gtaw-bash
      task: deny
  read-only:
    mode: subagent
    permission:
      edit: deny
      bash: deny
      task: deny
command:
  path: .opencode/commands/gta.md
  template: gta.md.tmpl
  args: "$ARGUMENTS"
files:
  - { template: opencode.json.tmpl, path: opencode.json }
