version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major versions are a human decision (AGENTS.md): gta-junit stays on JUnit 5.14 / platform 1.14 so it works
      # on Spring Boot 3.5 and 4.x, and the formatter, Maven and Java levels move together with the code.
      # Minor and patch updates, including security fixes, still arrive as pull requests.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
