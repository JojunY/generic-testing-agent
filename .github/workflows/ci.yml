name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]   # 17 is the floor gta promises; 21 is what most services use; 25 is the newest LTS
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "${{ matrix.java }}", cache: maven }
      - name: Build, unit tests, Spotless, SpotBugs, coverage gate, harness lint and sync check
        run: ./mvnw -B install
      - name: Diagrams are up to date
        if: matrix.java == '21'
        run: python3 scripts/diagrams/render.py --check
      - name: Scripted end-to-end run
        if: matrix.java == '21'
        run: evals/e2e/run.sh "$RUNNER_TEMP/gta-e2e"
      - name: Scripted end-to-end run, reactive and GraphQL catalog (P3 preview)
        if: matrix.java == '21'
        run: evals/e2e/run-catalog.sh "$RUNNER_TEMP/gta-e2e-catalog"
      - name: Gradle for the Gradle e2e
        if: matrix.java == '21'
        uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.14.3" }
      - name: Scripted end-to-end run, Gradle build
        if: matrix.java == '21'
        run: evals/e2e/run-gradle.sh "$RUNNER_TEMP/gta-e2e-gradle"
      - name: Scripted end-to-end run, service as a module of a multi-module repository
        if: matrix.java == '21'
        run: GTA_E2E_MODULE=order-service evals/e2e/run.sh "$RUNNER_TEMP/gta-e2e-module"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build and unit tests on Windows
        # the coverage gate is enforced on Linux, where the POSIX-only tests (stand-in Maven) run
        run: ./mvnw.cmd -B install -D"gta.coverage.haltOnFailure=false"
      - name: gtaw.cmd runs the local jar
        shell: cmd
        run: |
          set GTA_CLI_JAR=%CD%\toolkit\gta-cli\target\gta-cli.jar
          copy wrapper\gtaw.cmd evals\fixtures\order-service\gtaw.cmd
          cd evals\fixtures\order-service && gtaw.cmd --version
