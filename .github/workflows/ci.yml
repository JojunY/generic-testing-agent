name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a newer push to the same PR replaces the run in progress; runs on main are never cancelled, every merge is checked
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ["17", "21", "25"]   # 17 is the floor gta promises; 21 is what most services use; 25 is the newest LTS
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "${{ matrix.java }}", cache: maven }
      - name: Build, unit tests, Spotless, SpotBugs, coverage gate, harness lint and sync check
        run: ./mvnw -B install
      - name: Diagrams are up to date
        if: matrix.java == '21'
        run: python3 scripts/diagrams/render.py --check

  # the scripted e2e runs are independent of each other, so each gets its own runner (same scripts, same coverage)
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: main
            run: evals/e2e/run.sh "$RUNNER_TEMP/gta-e2e"
          - name: multi-module
            run: GTA_E2E_MODULE=order-service evals/e2e/run.sh "$RUNNER_TEMP/gta-e2e-module"
          - name: catalog
            run: evals/e2e/run-catalog.sh "$RUNNER_TEMP/gta-e2e-catalog"
          - name: adversarial
            run: evals/e2e/run-adversarial.sh "$RUNNER_TEMP/gta-e2e-adversarial"
          - name: gradle
            gradle: true
            run: evals/e2e/run-gradle.sh "$RUNNER_TEMP/gta-e2e-gradle"
    name: e2e (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build and install the toolkit (the build job runs the unit tests and checks)
        run: ./mvnw -B install -DskipTests
      - name: Gradle for the Gradle e2e
        if: matrix.gradle
        uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.14.3" }
      - name: Scripted end-to-end run
        run: ${{ matrix.run }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: "21", cache: maven }
      - name: Build and unit tests on Windows
        # the coverage gate is enforced on Linux, where the POSIX-only tests (stand-in Maven) run
        run: ./mvnw.cmd -B install -D"gta.coverage.haltOnFailure=false"
      - name: gtaw.cmd runs the local jar
        shell: cmd
        run: |
          set GTA_CLI_JAR=%CD%\toolkit\gta-cli\target\gta-cli.jar
          copy wrapper\gtaw.cmd evals\fixtures\order-service\gtaw.cmd
          cd evals\fixtures\order-service && gtaw.cmd --version
