syntax = "proto3";

package catalog;

option java_multiple_files = true;
option java_package = "com.example.catalog.grpc.proto";

service StockService {
  rpc GetStock (StockRequest) returns (StockReply);
}

message StockRequest {
  string product_id = 1;
}

message StockReply {
  string product_id = 1;
  int32 stock = 2;
  bool available = 3;
}
