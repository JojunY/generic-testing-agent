spring.application.name=lending-service
spring.config.import=sm@
inventory.url=https://inventory.internal.example
inventory.api-key=${sm@inventory-api-key}
spring.cloud.function.definition=recall
spring.cloud.stream.bindings.recall-in-0.destination=recall-notices
spring.cloud.stream.bindings.recall-out-0.destination=return-instructions
resilience4j.circuitbreaker.instances.inventory.sliding-window-size=10
resilience4j.circuitbreaker.instances.inventory.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.inventory.failure-rate-threshold=50
